<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://lint.page/kit/880bd5.js" crossorigin="anonymous"></script>
    <title>Business Card | Soto Design Co.</title>

    <style>
        html {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            box-sizing: border-box;
        }

        .card {
            max-width: 500px;
            min-height: 280px;
            background: white;
            border: 3px solid #4a86b8;
            border-radius: 14px;
            padding: 22px 28px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #4a86b8;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4a86b8;
            margin: 0 0 4px 0;
            line-height: 1.2;
        }

        .tagline {
            margin: 4px 0 0;
            font-size: 0.95rem;
            color: #666;
            font-style: italic;
            font-weight: bold;
        }

        .divider {
            border: none;
            height: 3px;
            background: linear-gradient(
                to right,
                #4a86b8,
                #e8c16c,
                #ff8c00,
                #4a86b8
            );
            margin: 16px 0;
            border-radius: 5px;
        }

        .contact {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            font-size: 0.9rem;
            color: #333;
        }

        .left p,
        .right p {
            margin: 4px 0;
        }

        .website {
            color: #ff8c00;
            font-weight: bold;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #888;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <main class="card">
        <section class="top-section">
            <div>
                <h1>Soto Design Co.</h1>
                <p class="tagline">Crafting Digital Identity With Style</p>
            </div>
        </section>

        <hr class="divider">

        <section class="contact">
            <div class="left">
                <h3>Danny Soto Duarte</h3>
                <p>5912 Sunnywood Pl</p>
                <p>Charlotte, NC 28110</p>
                <p>980-210-5405</p>
            </div>

            <div class="right">
                <p>dsoto3894@gmail.com</p>
                <p class="website">sotodesignco.com</p>
                <p>Web Consulting & Branding</p>
            </div>
        </section>

        <p class="footer-note">© 2026 Soto Design Co.</p>
    </main>

</body>
</html>
